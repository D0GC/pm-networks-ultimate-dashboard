configuration:
  hinweise_entitaet:
    name: Hinweis-Sensor
    description: Sensor mit dem Attribut zeilen wie bei den Panels Bad und Büro (Standard sensor.panel_bad_hinweise). Leer = keine Hinweiskarten.
  bewegung:
    name: Bewegungsmelder Flur
    description: Bewegung weckt das Panel aus dem Ruhezustand.
  personen:
    name: Personen
    description: Personen mit Anwesenheit auf der Startseite.
  wetter_entitaet:
    name: Wetter
    description: weather-Entität für aktuelle Lage und Vorschau.
  aussentemperatur:
    name: Außentemperatur
    description: Sensor für die große Temperaturanzeige. Leer = Temperatur der Wetter-Entität.
  alarm_entitaet:
    name: Alarmanlage
    description: alarm_control_panel für die Statuszeile.
  ereignis_ausloeser:
    name: Ereignis-Auslöser
    description: Wechselt eine dieser Entitäten auf „an“, zeigt das Panel die Kamera im Vollbild (z. B. Person oder Klingel an der Tür).
  ereignis_kamera:
    name: Ereignis-Kamera
    description: Kamera für das Overlay.
  tueroeffner:
    name: Türöffner
    description: button- oder lock-Entität für „Tür öffnen“. Auslösen nur nach 2 Sekunden Halten.
  haustueroeffner:
    name: Haustür-Öffner
    description: button-Entität des Haustür-Öffners für die Gruppe Zugang (Standard button.haustur_tur_offnen). Auslösen nur nach 2 Sekunden Halten.
  intercom_ausloeser:
    name: Klingel Haustür (Intercom)
    description: Wechselt eine dieser Entitäten auf „an“, zeigt das Panel das Overlay „Haustür“ mit Gegensprechen über PM Ring Intercom und dem Haustür-Öffner (Standard binary_sensor.haustur_klingelt).
  klima_praefix:
    name: Präfix PM Klima
    description: Nur Thermostate mit diesem Präfix werden gezeigt (Standard climate.pm_). Thermostate ohne Bereich werden über den Namen einem Bereich zugeordnet.
  klima_studio_url:
    name: Adresse PM Klima Studio
    description: Interne Adresse der App PM Klima Studio (Standard http://bdf1cc64-pm-klima-studio:8099).
  klima_studio_schluessel:
    name: Schlüssel PM Klima Studio
    description: Mindestens 16 Zeichen, derselbe Wert wie panel_schluessel in PM Klima Studio. Dann zeigt das Panel Klima Studio als eigene Seite.
  log_level:
    name: Protokollstufe
    description: debug, info, warning oder error.
network:
  8098/tcp: Wandpanel im lokalen Netz
