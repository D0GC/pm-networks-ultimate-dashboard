    description: "Veraltet: wird jetzt in der Einrichtung des Panels gewählt (PM Dashboard → Einstellungen → Einrichtung). Ein Wert hier gilt nur, solange die Einrichtung nichts anderes festlegt."
  klima_studio_url:
    name: Adresse PM Klima Studio
    description: "Veraltet: wird jetzt in der Einrichtung des Panels gewählt (PM Dashboard → Einstellungen → Einrichtung). Ein Wert hier gilt nur, solange die Einrichtung nichts anderes festlegt."
  klima_studio_schluessel:
    name: Schlüssel PM Klima Studio
    description: Mindestens 16 Zeichen, derselbe Wert wie panel_schluessel in PM Klima Studio. Dann zeigt das Panel Klima Studio als eigene Seite.
  telefon_server:
    name: "Telefon: FRITZ!Box"
    description: "Adresse der FRITZ!Box (z. B. 192.168.178.1). Leer = Telefon aus."
  telefon_benutzer:
    name: "Telefon: Benutzername"
    description: "Benutzername des IP-Telefons, das in der FRITZ!Box unter Telefonie → Telefoniegeräte angelegt wurde."
  telefon_passwort:
    name: "Telefon: Kennwort"
    description: "Kennwort dieses IP-Telefons."
  telefon_externe_adresse:
    name: "Telefon: Adresse von Home Assistant"
    description: "Nur nötig, wenn die automatische Erkennung scheitert: LAN-Adresse des Home-Assistant-Hosts."
  fritz_benutzer:
    name: "FRITZ!Box: Benutzer (Telefonbuch)"
    description: "FRITZ!Box-Benutzer mit dem Recht „Sprachnachrichten, Faxnachrichten, FRITZ!App Fon und Anrufliste“. Leer = ohne Kontakte und Anrufliste."
  fritz_passwort:
    name: "FRITZ!Box: Kennwort (Telefonbuch)"
    description: "Kennwort dieses Benutzers."
  unifi_adresse:
    name: "UniFi: Adresse des Gateways"
    description: "Für die Seite „Netzwerk“: Adresse des UniFi-Gateways (UniFi OS), z. B. https://192.168.1.1."
  unifi_api_schluessel:
    name: "UniFi: API-Schlüssel"
    description: "In UniFi Network unter Einstellungen → Control Plane → Integrationen erzeugen. Alternativ Benutzer und Kennwort eines lokalen Kontos."
  unifi_benutzer:
    name: "UniFi: Benutzer (statt API-Schlüssel)"
    description: "Lokales Konto mit Leserechten (nur nötig ohne API-Schlüssel)."
  unifi_kennwort:
    name: "UniFi: Kennwort"
    description: "Kennwort dieses Kontos."
  unifi_site:
    name: "UniFi: Site"
    description: "Kennung der Site, meist default."
  proxmox_adresse:
    name: "Proxmox: Adresse"
    description: "Adresse von Proxmox VE mit Port, z. B. https://192.168.1.10:8006."
  proxmox_token:
    name: "Proxmox: API-Token (nur lesend)"
    description: "Format benutzer@realm!name=geheimnis. In Proxmox unter Rechenzentrum → Berechtigungen → API-Tokens anlegen; Rolle PVEAuditor genügt, für IP-Adressen von VMs zusätzlich VM.Monitor (Proxmox 8) bzw. VM.GuestAgent.Audit (Proxmox 9), Gast-Agent nötig. Leer = nur Daten aus Home Assistant."
  lizenzschluessel:
    name: "Lizenzschlüssel"
    description: "Schlüssel von PM Networks (PMPS1.…). Einfacher im PM Dashboard unter Einstellungen → Lizenz; dort eingetragene Schlüssel gelten zusätzlich."
  log_level:
    name: Protokollstufe
    description: debug, info, warning oder error.
network:
  5062/udp: Telefon (SIP)
  40000/udp: Telefon (Ton)
  40001/udp: Telefon (Ton)
  40002/udp: Telefon (Ton)
  40003/udp: Telefon (Ton)
  8098/tcp: Wandpanel im lokalen Netz
